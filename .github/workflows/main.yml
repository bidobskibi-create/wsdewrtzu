name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The SDK tools need JDK 17+, so install the SDK BEFORE switching to JDK 11.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30 build-tools;30.0.3'

      # AGP 4.2.2 (used by this project) needs JDK 11
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Gradle 6.7.1
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-6.7.1/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: WatchLauncher
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: WatchLauncher-debug-apk
          path: WatchLauncher/app/build/outputs/apk/debug/app-debug.apk
